<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@500;700&display=swap">
<style>
/* Layout: black and neon-blue multi-page site. Public pages: home (hero, flip service cards, about, contact), services, school, book flow (service > demo/pay > form). Admin: login, then billing panel with Requests tab. */
:root {
  --ink: #03050b;
  --ink2: #070c1b;
  --panel: #0b1330;
  --panel2: #101c45;
  --blue: #2f6bff;
  --neon: #19d3ff;
  --neon2: #5b8cff;
  --fg: #f1f6ff;
  --muted: #a3b4da;
  --line: #1d2f66;
  --bad: #ff6b81;
  --f-display: "Unbounded", "Trebuchet MS", sans-serif;
  --f-body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-hi: "Noto Sans Devanagari", "Nirmala UI", "Mangal", sans-serif;
  --grad: linear-gradient(120deg, #2f6bff, #19d3ff);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--ink); color: var(--fg); font: 16px/1.6 var(--f-body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 24px; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
body::after { content: ""; position: fixed; inset: -20%; z-index: -1; pointer-events: none;
  background: radial-gradient(40% 35% at 12% 12%, rgba(47,107,255,.38), transparent 70%), radial-gradient(40% 40% at 90% 25%, rgba(25,211,255,.18), transparent 70%), radial-gradient(45% 40% at 70% 95%, rgba(47,107,255,.26), transparent 70%);
  animation: drift 24s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate3d(3%, -3%, 0) scale(1.08); } }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ink); }
.wrap { max-width: 1120px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--neon); outline-offset: 3px; }
svg { display: block; }
button { font-family: inherit; }

/* header */

        $('#bookbox').innerHTML = '<span class="ico">' + I.check + '</span><h2>Request received</h2><p class="muted">Thank you. Techreva will contact you soon on ' + esc(o.Mobile) + '.' + (DEMO ? ' (Preview mode: nothing was saved.)' : '') + '</p><div class="summary">' + esc('Service: ' + o.Category + '\nType: ' + o.Type + '\nSchool: ' + o.School + '\nMobile: ' + o.Mobile + '\nWhatsApp: ' + o.WhatsApp + '\nEmail: ' + o.Email + '\nSoftware: ' + o.Service) + '</div><div class="row"><a class="btn" href="#home">Back to home</a><a class="btn line" href="#services">More services</a></div>';
        $('#bookbox').scrollIntoView({ block: 'center' });
      } catch (x) { btn.disabled = false; fail('Could not send the request: ' + x.message + '. Please try again or call ' + PHONE + '.'); }
    } else if (f.id === 'lf') {
      var le = $('#lerr'), lb = $('#lbtn'); le.hidden = true;
      if (!$('#l_mail').value.trim() || !$('#l_pass').value) { le.textContent = 'Enter your email and password.'; le.hidden = false; return; }
      lb.disabled = true;
      try { var r = await api('login', $('#l_mail').value.trim(), $('#l_pass').value); saveTok(r.token); nav('admin'); }
      catch (x) { le.textContent = x.message; le.hidden = false; lb.disabled = false; }
    } else if (f.id === 'fs') {
      var o2 = Object.fromEntries(new FormData(f)), was = editS, req = fromReq; if (!req) delete o2.FromRequest;
      var ok = was ? await run('updateSchool', Object.assign({}, o2, { ID: was })) : await run('addSchool', o2);
      if (ok) { toast(was ? 'School updated' : req ? 'School created from request' : 'School saved'); resetS(); showTab('list'); }
    } else if (f.id === 'fp') {
      var fd = Object.fromEntries(new FormData(f)), s = D.s.find(function (x) { return x.ID == $('#ss').value; }); if (!s) return;
      var b = +fd.Base, g = +(b * $('#gp').value / 100).toFixed(2), o3 = { SchoolID: s.ID, School: s.Name, Month: fd.Month, Base: b, GST: g, Total: +(b + g).toFixed(2), Mode: fd.Mode, Mobile: s.Mobile, WhatsApp: s.WhatsApp, PayDate: fd.PayDate }, wp = editP;
      var ok2 = wp ? await run('updatePay', Object.assign({}, o3, { Receipt: wp })) : await run('addPay', o3);
      if (ok2) { toast(wp ? 'Payment updated' : 'Payment recorded'); resetP(); rcpt(wp || D.p[D.p.length - 1].Receipt); }
    }
  });

  /* touch / click bubbles */
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches, cols = ['#19d3ff', '#2f6bff', '#5b8cff', '#ffffff'];
  document.addEventListener('pointerdown', function (e) {
    if (reduce) return;
    var r = document.createElement('span'); r.className = 'pop ring'; r.style.left = e.clientX + 'px'; r.style.top = e.clientY + 'px'; document.body.appendChild(r); setTimeout(function () { r.remove(); }, 800);
    for (var i = 0; i < 8; i++) {
      var d = document.createElement('span'), a = Math.random() * 6.283, dist = 30 + Math.random() * 50, s = 5 + Math.random() * 8, c = cols[i % 4];
      d.className = 'pop dot'; d.style.cssText = 'left:' + e.clientX + 'px;top:' + e.clientY + 'px;width:' + s + 'px;height:' + s + 'px;background:' + c + ';box-shadow:0 0 10px ' + c + ';--dx:' + Math.cos(a) * dist + 'px;--dy:' + Math.sin(a) * dist + 'px';
      document.body.appendChild(d); (function (n) { setTimeout(function () { n.remove(); }, 900); })(d);
    }
  }, { passive: true });

  route();
})();
</script>
