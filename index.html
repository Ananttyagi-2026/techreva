<style>
:root {
  --bg: #f7f5f0;
  --bg2: #ffffff;
  --cream: #f0ebe3;
  --ink: #171a20;
  --muted: #5c5e62;
  --line: #e5e3de;
  --line2: #d4d1c9;
  --blue: #3e6ae1;
  --blue-soft: #e8f0fe;
  --teal: #1a8a7a;
  --teal-soft: #e6f5f2;
  --amber: #c47a2c;
  --amber-soft: #fdf4e9;
  --rose: #9b4d6c;
  --rose-soft: #f9eef3;
  --panel: #ffffff;
  --shadow: 0 4px 24px rgba(23,26,32,.06);
  --shadow-lg: 0 12px 48px rgba(23,26,32,.1);
  --radius: 16px;
  --radius-lg: 24px;
  --f: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-display: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --header-h: 64px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--f);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
ul { list-style: none; }

/* ---------- Header (Tesla-style transparent) ---------- */
.site-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: var(--header-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px;
  transition: background .35s, box-shadow .35s, backdrop-filter .35s;
}
.site-header.scrolled {
  background: rgba(247,245,240,.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 1px 0 var(--line);
}
.logo {
  font-weight: 700; font-size: 20px; letter-spacing: -.02em;
  display: flex; align-items: center; gap: 8px;
}
.logo span { color: var(--blue); }
.nav-links { display: flex; gap: 28px; align-items: center; }
.nav-links a {
  font-size: 14px; font-weight: 500; color: var(--muted);
  transition: color .2s;
}
.nav-links a:hover, .nav-links a.on { color: var(--ink); }
.nav-cta {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--ink); color: #fff !important;
  padding: 10px 20px; border-radius: 99px;
  font-size: 13px; font-weight: 600;
  transition: background .2s, transform .15s;
}
.nav-cta:hover { background: #2a2e36; }
.menu-btn { display: none; width: 40px; height: 40px; place-items: center; border-radius: 10px; }
.menu-btn svg { width: 22px; height: 22px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 28px;
  border-radius: 99px; font-weight: 600; font-size: 14px;
  transition: transform .15s, background .2s, box-shadow .2s, color .2s;
  white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: #2f56c8; box-shadow: 0 8px 24px rgba(62,106,225,.3); }
.btn-dark { background: var(--ink); color: #fff; }
.btn-dark:hover { background: #2a2e36; }
.btn-outline {
  background: transparent; color: var(--ink);
  border: 1.5px solid var(--line2);
}
.btn-outline:hover { border-color: var(--ink); background: var(--bg2); }
.btn-ghost { background: transparent; color: var(--muted); }
.btn-ghost:hover { color: var(--ink); }
.btn-sm { min-height: 36px; padding: 0 16px; font-size: 13px; }
.btn-lg { min-height: 56px; padding: 0 36px; font-size: 15px; }

/* ---------- Hero Slider ---------- */
.hero {
  position: relative; height: 100vh; min-height: 620px;
  overflow: hidden; background: var(--cream);
}
.hero-track {
  display: flex; height: 100%;
  transition: transform .7s cubic-bezier(.25,.8,.25,1);
}
.hero-slide {
  flex: 0 0 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  position: relative; padding: 100px 40px 80px;
  background-size: cover; background-position: center;
}
.hero-slide::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(160deg, rgba(247,245,240,.88) 0%, rgba(247,245,240,.55) 50%, rgba(247,245,240,.75) 100%);
}
.hero-content {
  position: relative; z-index: 2; text-align: center;
  max-width: 820px; margin: 0 auto;
}
.hero-kicker {
  font-size: 13px; font-weight: 600; letter-spacing: .12em;
  text-transform: uppercase; color: var(--blue); margin-bottom: 16px;
}
.hero-title {
  font-size: clamp(40px, 7vw, 72px); font-weight: 700;
  letter-spacing: -.03em; line-height: 1.08; margin-bottom: 18px;
}
.hero-sub {
  font-size: clamp(16px, 2.2vw, 20px); color: var(--muted);
  max-width: 520px; margin: 0 auto 36px; line-height: 1.55;
}
.hero-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.hero-nav {
  position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 10px; z-index: 5;
}
.hero-dot {
  width: 8px; height: 8px; border-radius: 99px;
  background: var(--line2); border: 0; transition: all .3s; cursor: pointer;
}
.hero-dot.on { width: 28px; background: var(--ink); }
.hero-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 48px; height: 48px; border-radius: 50%;
  background: rgba(255,255,255,.85); border: 1px solid var(--line);
  display: grid; place-items: center; z-index: 5;
  box-shadow: var(--shadow); transition: background .2s;
}
.hero-arrow:hover { background: #fff; }
.hero-arrow.prev { left: 20px; }
.hero-arrow.next { right: 20px; }
.hero-arrow svg { width: 20px; height: 20px; }

/* swipe / scroll hints */
.hint-finger {
  position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
  z-index: 4; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  opacity: 0; animation: hintIn 1s .8s forwards, hintPulse 2s 1.8s ease-in-out infinite;
}
.hint-finger svg { width: 28px; height: 28px; color: var(--muted); }
.hint-finger span { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
@keyframes hintIn { to { opacity: 1; } }
@keyframes hintPulse {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(8px); }
}

/* ---------- Sections ---------- */
.section { padding: 88px 28px; }
.section-inner { max-width: 1120px; margin: 0 auto; }
.section-head { text-align: center; margin-bottom: 48px; }
.section-kicker {
  font-size: 12px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--blue); margin-bottom: 10px;
}
.section-title {
  font-size: clamp(28px, 4vw, 42px); font-weight: 700;
  letter-spacing: -.02em; margin-bottom: 12px;
}
.section-sub { color: var(--muted); max-width: 520px; margin: 0 auto; font-size: 16px; }

/* Service carousel */
.carousel-wrap { position: relative; margin: 0 -28px; padding: 0 28px; }
.carousel {
  display: flex; gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch; padding: 12px 4px 28px;
  scrollbar-width: none;
}
.carousel::-webkit-scrollbar { display: none; }
.svc-card {
  flex: 0 0 min(300px, 82vw); scroll-snap-align: start;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: 28px 24px 24px;
  box-shadow: var(--shadow); transition: transform .25s, box-shadow .25s;
  display: flex; flex-direction: column; min-height: 320px;
}
.svc-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.svc-card .ico {
  width: 56px; height: 56px; border-radius: 16px;
  display: grid; place-items: center; margin-bottom: 20px;
  background: var(--blue-soft); color: var(--blue);
}
.svc-card .ico svg { width: 28px; height: 28px; }
.svc-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; letter-spacing: -.01em; }
.svc-card p { color: var(--muted); font-size: 14px; flex: 1; margin-bottom: 20px; }
.svc-card .card-actions { display: flex; gap: 10px; }
.svc-card.school .ico { background: var(--teal-soft); color: var(--teal); }
.svc-card.web .ico { background: var(--blue-soft); color: var(--blue); }
.svc-card.app .ico { background: var(--amber-soft); color: var(--amber); }
.svc-card.ai .ico { background: var(--rose-soft); color: var(--rose); }

.carousel-hint {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-top: 8px; color: var(--muted); font-size: 13px; font-weight: 500;
}
.carousel-hint svg { width: 18px; height: 18px; animation: swipeHint 1.6s ease-in-out infinite; }
@keyframes swipeHint {
  0%, 100% { transform: translateX(0); opacity: .6; }
  50% { transform: translateX(10px); opacity: 1; }
}

/* Pricing panels */
.pricing-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px; margin-top: 32px;
}
.price-card {
  background: var(--panel); border: 1.5px solid var(--line);
  border-radius: var(--radius-lg); padding: 28px 24px;
  position: relative; overflow: hidden;
  transition: transform .25s, box-shadow .25s, border-color .25s;
}
.price-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.price-card.best { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
.price-card .badge {
  position: absolute; top: 16px; right: 16px;
  background: var(--blue); color: #fff;
  font-size: 11px; font-weight: 700; letter-spacing: .06em;
  padding: 4px 10px; border-radius: 99px; text-transform: uppercase;
}
.price-card .plan-ico {
  width: 48px; height: 48px; border-radius: 14px;
  display: grid; place-items: center; margin-bottom: 16px;
  font-size: 22px;
}
.price-card h4 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.price-card .plan-desc { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.price-card .price {
  font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 4px;
}
.price-card .price small { font-size: 14px; font-weight: 500; color: var(--muted); }
.price-card .gst { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
.price-card ul { margin-bottom: 22px; }
.price-card li {
  font-size: 13px; color: var(--muted); padding: 5px 0 5px 20px;
  position: relative;
}
.price-card li::before {
  content: ''; position: absolute; left: 0; top: 11px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--blue); opacity: .5;
}
.price-card.offline { --accent: #3e6ae1; }
.price-card.offline .plan-ico { background: #e8f0fe; color: #3e6ae1; }
.price-card.online { --accent: #1a8a7a; }
.price-card.online .plan-ico { background: #e6f5f2; color: #1a8a7a; }
.price-card.combo { --accent: #c47a2c; }
.price-card.combo .plan-ico { background: #fdf4e9; color: #c47a2c; }
.price-card.custom { --accent: #9b4d6c; }
.price-card.custom .plan-ico { background: #f9eef3; color: #9b4d6c; }
.price-card.starter { --accent: #3e6ae1; }
.price-card.starter .plan-ico { background: #e8f0fe; color: #3e6ae1; }
.price-card.business { --accent: #1a8a7a; }
.price-card.business .plan-ico { background: #e6f5f2; color: #1a8a7a; }
.price-card.advanced { --accent: #c47a2c; }
.price-card.advanced .plan-ico { background: #fdf4e9; color: #c47a2c; }

/* Feature icons grid for non-priced services */
.feat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 18px; margin-top: 28px;
}
.feat-item {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 22px 20px;
  text-align: center; transition: transform .2s, box-shadow .2s;
}
.feat-item:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.feat-item .ico {
  width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 14px;
  display: grid; place-items: center;
}
.feat-item .ico svg { width: 26px; height: 26px; }
.feat-item h4 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.feat-item p { font-size: 13px; color: var(--muted); }

/* Detail page */
.page { padding: 100px 28px 60px; max-width: 960px; margin: 0 auto; animation: fadeUp .45s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } }
.crumb {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; color: var(--muted);
  margin-bottom: 24px; transition: color .2s;
}
.crumb:hover { color: var(--ink); }
.crumb svg { width: 16px; height: 16px; }
.svc-banner {
  display: flex; gap: 24px; align-items: flex-start;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: 28px;
  margin-bottom: 36px; box-shadow: var(--shadow);
}
.svc-banner .ico {
  width: 64px; height: 64px; border-radius: 18px; flex-shrink: 0;
  display: grid; place-items: center;
}
.svc-banner .ico svg { width: 32px; height: 32px; }
.svc-banner h1 { font-size: clamp(24px, 3.5vw, 32px); font-weight: 700; letter-spacing: -.02em; margin-bottom: 6px; }
.svc-banner p { color: var(--muted); font-size: 15px; }
.svc-banner .tag {
  margin-left: auto; align-self: flex-start;
  background: var(--blue-soft); color: var(--blue);
  font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 99px;
}
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 12px; }
.mode-card {
  background: var(--panel); border: 1.5px solid var(--line);
  border-radius: var(--radius-lg); padding: 28px 24px;
  transition: border-color .2s, box-shadow .2s, transform .2s;
  display: flex; flex-direction: column; gap: 10px;
}
.mode-card:hover { border-color: var(--blue); box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.mode-card .ico {
  width: 48px; height: 48px; border-radius: 14px;
  display: grid; place-items: center; background: var(--blue-soft); color: var(--blue);
}
.mode-card .ico svg { width: 24px; height: 24px; }
.mode-card b { font-size: 18px; }
.mode-card .s { color: var(--muted); font-size: 14px; flex: 1; }
.mode-card .go { font-size: 13px; font-weight: 600; color: var(--blue); display: flex; align-items: center; gap: 4px; }
.mode-card .go svg { width: 16px; height: 16px; }

/* Form */
.formbox {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: 32px 28px;
  box-shadow: var(--shadow); margin-top: 24px;
}
.formbox h2 { font-size: 22px; font-weight: 700; margin-bottom: 20px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.stack input, .stack select {
  min-height: 48px; padding: 0 16px;
  border: 1.5px solid var(--line); border-radius: 12px;
  background: var(--bg); font-size: 15px; color: var(--ink);
  transition: border-color .2s, box-shadow .2s;
}
.stack input:focus, .stack select:focus {
  outline: none; border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(62,106,225,.15);
}
.svc-radios { display: flex; flex-wrap: wrap; gap: 10px; }
.svc-radios label {
  flex-direction: row; align-items: center; gap: 8px;
  padding: 10px 16px; border: 1.5px solid var(--line);
  border-radius: 99px; cursor: pointer; font-weight: 500; color: var(--ink);
  transition: border-color .2s, background .2s;
}
.svc-radios input { display: none; }
.svc-radios input:checked + span,
.svc-radios label:has(input:checked) {
  border-color: var(--blue); background: var(--blue-soft); color: var(--blue);
}
.err { color: #c0392b; font-size: 13px; font-weight: 600; margin-top: 8px; }

    var q = ($('#q') && $('#q').value || '').toLowerCase();
    if (!$('#sl')) return;
    $('#sl').innerHTML = D.s.filter(function (s) { return JSON.stringify(s).toLowerCase().indexOf(q) >= 0; }).map(function (s) {
      var x = info(s), id = esc(s.ID);
      return '<tr><td>' + id + '</td><td>' + esc(s.Name) + '</td><td>' + esc(s.DISE) + '</td><td>' + esc(s.Mobile) + '</td><td>' + esc(s.WhatsApp) + '</td><td><span class="bd">' + esc(sc(s.Service)) + '</span></td><td><span class="bd ' + x.st + '">' + x.st + '</span></td><td>' + (x.st === 'Demo' ? x.left + 'd' : '-') + '</td><td><span class="acts"><button class="btn btn-sm btn-primary" data-act="pay" data-id="' + id + '">Pay</button><button class="btn btn-sm btn-outline" data-act="editSchool" data-id="' + id + '">Edit</button><button class="btn btn-sm btn-outline" data-act="delSchool" data-id="' + id + '">Del</button></span></td></tr>';
    }).join('') || '<tr><td colspan="9">No schools</td></tr>';
  }
  function rep() {
    var m = $('#rm') && $('#rm').value;
    var list = m ? D.p.filter(function (p) { return (p.Month || '').indexOf(m.slice(0, 4)) >= 0 || (p.PayDate || '').indexOf(m) >= 0; }) : D.p;
    var rev = list.reduce(function (s, p) { return s + +p.Total; }, 0);
    if ($('#rpstats')) $('#rpstats').innerHTML = '<div class="stat"><small>Payments</small><b>' + list.length + '</b></div><div class="stat"><small>Revenue</small><b>' + inr(rev) + '</b></div>';
    if ($('#rp')) $('#rp').innerHTML = list.slice().reverse().slice(0, 20).map(function (p) {
      return '<tr><td>' + esc(p.Receipt) + '</td><td>' + esc(p.School) + '</td><td>' + esc(mlab(p.Month)) + '</td><td>' + inr(p.Total) + '</td><td>' + pbtn(p) + '</td></tr>';
    }).join('') || '<tr><td colspan="5">No data</td></tr>';
  }
  function rcpt(id) {
    var p = D.p.find(function (x) { return x.Receipt === id; }); if (!p) return;
    var s = D.s.find(function (x) { return x.ID === p.SchoolID; }) || {};
    var isFY = (p.Month || '').indexOf('-') > 2;
    var yr = p.Month || '-';
    var dt = p.PayDate || fmt(p.Date);
    var pct = p.Base ? Math.round(+p.GST / +p.Base * 100) : 18;
    $('#rcptBody').innerHTML = '<div style="display:flex;justify-content:space-between;align-items:start"><div><b style="font-size:18px">' + BIZ.name + '</b><br><small style="color:var(--muted)">' + BIZ.tag + '</small></div><div style="text-align:right"><b style="color:var(--blue)">PAID</b></div></div>' +
      '<table style="margin-top:20px"><tr><td style="width:50%">Receipt</td><td><b>' + esc(p.Receipt) + '</b></td></tr><tr><td>School</td><td>' + esc(p.School) + '</td></tr><tr><td>' + (isFY ? 'Year' : 'Period') + '</td><td>' + esc(yr) + '</td></tr><tr><td>Date</td><td>' + esc(dt) + '</td></tr></table>' +
      '<table><tr><th>#</th><th>Description</th><th>Amount</th></tr><tr><td>1</td><td>Software subscription' + (s.Service ? ' (' + esc(s.Service) + ')' : '') + '</td><td>' + inr(p.Base) + '</td></tr><tr><td></td><td>GST @ ' + pct + '%</td><td>' + inr(p.GST) + '</td></tr><tr class="gt"><td></td><td>Total Paid</td><td>' + inr(p.Total) + '</td></tr></table>' +
      '<div class="words"><small>AMOUNT IN WORDS</small><br><b>' + words(+p.Total) + '</b></div>' +
      '<div class="sg"><span>Computer generated</span><span>Authorised Signature</span></div>' +
      '<div style="display:flex;gap:10px;margin-top:20px;justify-content:center"><button class="btn btn-outline btn-sm" id="rclose">Close</button><button class="btn btn-primary btn-sm" id="rprint">Print</button><a class="btn btn-outline btn-sm" id="wa" target="_blank">WhatsApp</a></div>';
    var wn = String(p.WhatsApp || '').replace(/\D/g, '');
    $('#wa').href = 'https://wa.me/91' + wn + '?text=' + encodeURIComponent('*' + BIZ.name + ' - Payment Receipt*\nReceipt: ' + p.Receipt + '\nSchool: ' + p.School + '\nAmount: ' + inr(p.Total) + '\nThank you!');
    $('#md').hidden = false;
  }
  async function run(f) {
    try {
      if (f === 'getAll') { D = await api('getAll'); refresh(); return true; }
      var args = Array.prototype.slice.call(arguments, 1);
      await api.apply(null, [f].concat(args));
      await run('getAll');
      return true;
    } catch (e) { toast(e.message || 'Error', 1); return false; }
  }
  function adminInit() {
    var now = new Date(); today = new Date(Date.now() - now.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
    if ($('#rm')) $('#rm').value = today.slice(0, 7);
    D = { s: [], p: [], r: [] }; editS = editP = fromReq = null;
    if ($('#q')) $('#q').oninput = list;
    if ($('#rm')) $('#rm').onchange = rep;
    run('getAll');
  }
  function doLogout(expired) {
    try { if (TOKEN && !expired) api('logout').catch(function () {}); } catch (e) {}
    saveTok(''); updateAdminBtn(); if (expired) toast('Session ended. Please login again.', 1); nav('admin-login');
  }
  function nav(h) { var same = location.hash === '#' + h; location.hash = h; if (same) route(); }

  /* ---------- Hero slider logic ---------- */
  var heroIdx = 0, heroTimer = null;
  function heroGo(i) {
    var track = $('#heroTrack'); if (!track) return;
    var n = track.children.length;
    heroIdx = (i + n) % n;
    track.style.transform = 'translateX(-' + heroIdx * 100 + '%)';
    $$('#heroDots .hero-dot').forEach(function (d, j) { d.classList.toggle('on', j === heroIdx); });
  }
  function heroInit() {
    var track = $('#heroTrack'); if (!track) return;
    var n = track.children.length;
    var dots = $('#heroDots');
    if (dots) {
      dots.innerHTML = '';
      for (var i = 0; i < n; i++) {
        var b = document.createElement('button');
        b.className = 'hero-dot' + (i === 0 ? ' on' : '');
        b.setAttribute('aria-label', 'Slide ' + (i + 1));
        (function (j) { b.onclick = function () { heroGo(j); resetHeroTimer(); }; })(i);
        dots.appendChild(b);
      }
    }
    var prev = $('#heroPrev'), next = $('#heroNext');
    if (prev) prev.onclick = function () { heroGo(heroIdx - 1); resetHeroTimer(); };
    if (next) next.onclick = function () { heroGo(heroIdx + 1); resetHeroTimer(); };
    // touch swipe
    var startX = 0;
    track.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; }, { passive: true });
    track.addEventListener('touchend', function (e) {
      var dx = e.changedTouches[0].clientX - startX;
      if (Math.abs(dx) > 50) { heroGo(heroIdx + (dx < 0 ? 1 : -1)); resetHeroTimer(); }
    }, { passive: true });
    resetHeroTimer();
    setTimeout(function () { var h = $('#heroHint'); if (h) h.style.display = 'none'; }, 5000);
  }
  function resetHeroTimer() {
    clearInterval(heroTimer);
    heroTimer = setInterval(function () { heroGo(heroIdx + 1); }, 6000);
  }

  /* ---------- Router ---------- */
  function route() {
    var p = (location.hash || '#home').slice(1).split('/'), t = p[0] || 'home', h = '', g = t;
    if (t === 'home') h = pHome();
    else if (t === 'services') h = pServices();
    else if (t === 'school') h = pSchool();
    else if (t === 'about') h = aboutSec(true);
    else if (t === 'contact') h = contactSec(true);
    else if (t === 'book') {
      g = 'services';
      var c = byId[p[1]];
      h = !c ? pServices() : (p[2] === 'demo' || p[2] === 'pay') ? pForm(c, p[2]) : pChoose(c);
    }
    else if (t === 'admin-login') { g = ''; if (TOKEN) { location.hash = 'admin'; return; } h = pLogin(); }
    else if (t === 'admin') { g = ''; if (!TOKEN) { location.hash = 'admin-login'; return; } h = pAdmin(); }
    else h = pHome();
    $('#md').hidden = true;
    view.innerHTML = h;
    setActive(g);
    updateAdminBtn();
    window.scrollTo(0, 0);
    if (t === 'admin') adminInit();
    if (t === 'home') setTimeout(heroInit, 50);
    // header scroll state
    onScroll();
  }
  window.addEventListener('hashchange', route);

  function onScroll() {
    var hdr = $('#hdr');
    if (!hdr) return;
    var y = window.scrollY || 0;
    var isHome = (location.hash || '#home') === '#home' || location.hash === '';
    hdr.classList.toggle('scrolled', y > 40 || !isHome);
  }
  window.addEventListener('scroll', onScroll, { passive: true });

  /* ---------- Events ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target, el;
    if ((el = t.closest('[data-tab]'))) return showTab(el.dataset.tab);
    if (t.closest('[data-logout]')) return doLogout(false);
    if (t.closest('#rclose')) { $('#md').hidden = true; return; }
    if (t.closest('#rprint')) { window.print(); return; }
    if ((el = t.closest('#adm [data-act]'))) {
      var id = el.dataset.id;
      var acts = {
        view: function () { rcpt(id); },
        pay: function () { /* simplified */ toast('Open Payments tab to record'); showTab('pay'); },
        editSchool: function () { toast('Edit school: use full admin in production'); },
        delSchool: function () { if (confirm('Delete school?')) run('delSchool', id); },
        pass: function () { run('passReq', id); },
        reject: function () { run('rejectReq', id); }
      };
      if (acts[el.dataset.act]) acts[el.dataset.act]();
    }
    if (t.closest('#menuBtn')) {
      var nav = $('#navLinks');
      if (nav.style.display === 'flex') nav.style.display = '';
      else { nav.style.display = 'flex'; nav.style.flexDirection = 'column'; nav.style.position = 'absolute'; nav.style.top = '64px'; nav.style.right = '16px'; nav.style.background = '#fff'; nav.style.padding = '16px'; nav.style.borderRadius = '16px'; nav.style.boxShadow = 'var(--shadow-lg)'; nav.style.gap = '12px'; }
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.matches && e.target.matches('[inputmode=numeric]') && e.target.id !== 'x') e.target.value = e.target.value.replace(/\D/g, '');
  });

  document.addEventListener('submit', async function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.id === 'bf') {
      var c = byId[f.dataset.cat], v = function (id) { return $('#' + id).value.trim(); }, er = $('#ferr');
      var fail = function (m, id) { er.textContent = m; er.hidden = false; if (id) $('#' + id).focus(); };
      if (!v('f_school')) return fail('Enter school / organisation name.', 'f_school');
      if (!/^\d{10}$/.test(v('f_mob'))) return fail('Enter a 10-digit mobile number.', 'f_mob');
      if (!/^\S+@\S+\.\S+$/.test(v('f_mail'))) return fail('Enter a valid email.', 'f_mail');
      if (!/^\d{10}$/.test(v('f_wa'))) return fail('Enter a 10-digit WhatsApp number.', 'f_wa');
      er.hidden = true;
      var btn = $('#fbtn'); btn.disabled = true;
      var svcEl = f.querySelector('input[name=svc]:checked') || f.querySelector('input[name=svc]');
      var o = { School: v('f_school'), Mobile: v('f_mob'), Email: v('f_mail'), WhatsApp: v('f_wa'), Service: svcEl ? svcEl.value : c.name, Type: f.dataset.type, Category: c.name };
      try {
        await api('submitRequest', o);
        $('#bookbox').className = 'formbox done';
        $('#bookbox').innerHTML = '<span class="ico">' + I.check + '</span><h2>Request received</h2><p class="muted" style="color:var(--muted)">Thank you. Techreva will contact you soon on ' + esc(o.Mobile) + '.' + (DEMO ? ' (Preview mode.)' : '') + '</p><div class="summary">' + esc('Service: ' + o.Category + '\nType: ' + o.Type + '\nSchool: ' + o.School + '\nMobile: ' + o.Mobile + '\nWhatsApp: ' + o.WhatsApp + '\nEmail: ' + o.Email + '\nPreference: ' + o.Service) + '</div><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><a class="btn btn-primary" href="#home">Home</a><a class="btn btn-outline" href="#services">More services</a></div>';
      } catch (x) { btn.disabled = false; fail('Could not send: ' + x.message + '. Call ' + PHONE + '.'); }
    } else if (f.id === 'lf') {
      var le = $('#lerr'), lb = $('#lbtn'); le.hidden = true;
      if (!$('#l_mail').value.trim() || !$('#l_pass').value) { le.textContent = 'Enter email and password.'; le.hidden = false; return; }
      lb.disabled = true;
      try { var r = await api('login', $('#l_mail').value.trim(), $('#l_pass').value); saveTok(r.token); nav('admin'); }
      catch (x) { le.textContent = x.message; le.hidden = false; lb.disabled = false; }
    }
  });

  /* keyboard hero */
  document.addEventListener('keydown', function (e) {
    if (!$('#heroTrack')) return;
    if (e.key === 'ArrowLeft') { heroGo(heroIdx - 1); resetHeroTimer(); }
    if (e.key === 'ArrowRight') { heroGo(heroIdx + 1); resetHeroTimer(); }
  });

  route();
})();
</script>
</body>
</html>
