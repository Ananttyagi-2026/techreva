<style>
:root{--ink:#03050b;--panel:#0b1330;--blue:#2f6bff;--neon:#19d3ff;--fg:#f1f6ff;--muted:#a3b4da;--line:#1d2f66;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ink);color:var(--fg);font:16px/1.6 "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;overflow-x:hidden;position:relative;-webkit-tap-highlight-color:transparent;
 padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg::before{content:"";position:absolute;inset:-20%;background:radial-gradient(40% 35% at 15% 15%,rgba(47,107,255,.4),transparent 70%),radial-gradient(40% 40% at 88% 25%,rgba(25,211,255,.2),transparent 70%),radial-gradient(45% 40% at 70% 98%,rgba(47,107,255,.28),transparent 70%);animation:drift 20s ease-in-out infinite alternate}
.bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(25,211,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(25,211,255,.06) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);animation:grid 12s linear infinite}
@keyframes drift{to{transform:translate3d(3%,-3%,0) scale(1.08)}}
@keyframes grid{to{background-position:0 48px,48px 0}}
.p{position:absolute;border-radius:50%;background:var(--neon);box-shadow:0 0 12px var(--neon);opacity:.7;animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:.8}to{transform:translateY(-110vh);opacity:0}}
main{position:relative;z-index:1;width:100%;max-width:760px;text-align:center;display:grid;gap:18px;justify-items:center}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.logo img{width:44px;height:44px;border-radius:11px;box-shadow:0 0 16px rgba(25,211,255,.6)}
.logo b{font-family:Unbounded,"Trebuchet MS",sans-serif;letter-spacing:.08em;font-size:18px}
.scene{width:min(100%,620px);position:relative}
.scene svg{width:100%;height:auto;display:block;overflow:visible}
.num{font-family:Unbounded,"Trebuchet MS",sans-serif;font-weight:800}
.four{animation:flt 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.four.b{animation-delay:-2.5s}
@keyframes flt{50%{transform:translateY(-12px)}}
.sweep{transform-origin:310px 150px;animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{transform-origin:310px 150px;animation:pl 3.2s ease-out infinite}
.ring.r2{animation-delay:-1.6s}
@keyframes pl{from{transform:scale(.55);opacity:.9}to{transform:scale(1.15);opacity:0}}
.blip{animation:bl 3.2s linear infinite}
@keyframes bl{0%,55%{opacity:0}60%{opacity:1}100%{opacity:0}}
.glass{transform-origin:310px 150px;animation:scan 7s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translate(-34px,18px) rotate(-8deg)}50%{transform:translate(38px,-14px) rotate(8deg)}}
h1{font-family:Unbounded,"Trebuchet MS",sans-serif;font-size:clamp(24px,5.4vw,40px);font-weight:800;margin:0;line-height:1.2;text-wrap:balance;position:relative}
h1 .g{position:relative;display:inline-block}
h1 .g::before,h1 .g::after{content:attr(data-t);position:absolute;inset:0;overflow:hidden}
h1 .g::before{color:var(--neon);animation:gl1 3.5s infinite steps(1);clip-path:inset(0 0 100% 0)}
h1 .g::after{color:var(--blue);animation:gl2 3.5s infinite steps(1);clip-path:inset(100% 0 0 0)}
@keyframes gl1{0%,88%,100%{clip-path:inset(0 0 100% 0);transform:none}90%{clip-path:inset(20% 0 55% 0);transform:translateX(-4px)}94%{clip-path:inset(60% 0 15% 0);transform:translateX(4px)}}
@keyframes gl2{0%,89%,100%{clip-path:inset(100% 0 0 0);transform:none}92%{clip-path:inset(45% 0 30% 0);transform:translateX(4px)}96%{clip-path:inset(10% 0 70% 0);transform:translateX(-4px)}}
.sub{color:var(--muted);max-width:54ch;margin:0}
.hi{font-family:"Noto Sans Devanagari","Nirmala UI","Mangal",sans-serif;font-weight:700;color:#dfe9ff;font-size:clamp(17px,3.6vw,22px);margin:0}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 26px;border-radius:99px;text-decoration:none;position:relative;overflow:hidden;cursor:pointer;border:0;
 font-family:Unbounded,"Trebuchet MS",sans-serif;font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;background:linear-gradient(120deg,#2f6bff,#19d3ff);background-size:200% 100%;color:#02060f;
 box-shadow:0 0 24px rgba(25,211,255,.55);transition:transform .15s,box-shadow .2s,background-position .5s}
.btn:hover{background-position:100% 0;box-shadow:0 0 38px rgba(25,211,255,.9)}
.btn:active{transform:scale(.95)}
.btn.line{background:transparent;color:#fff;box-shadow:0 0 0 2px var(--neon) inset,0 0 18px rgba(25,211,255,.3)}
.btn.line:hover{background:rgba(25,211,255,.14)}
.btn svg{width:18px;height:18px}
:focus-visible{outline:3px solid var(--neon);outline-offset:3px}
.links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.links a{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:rgba(11,19,48,.7);color:#dbe6ff;text-decoration:none;font-size:13px;font-weight:700;transition:all .2s}
.links a:hover{border-color:var(--neon);color:#fff;box-shadow:0 0 16px rgba(25,211,255,.4)}
.code{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--neon);border:1px solid var(--neon);border-radius:99px;padding:5px 14px;background:rgba(25,211,255,.08);font-weight:700}
.tag{color:var(--muted);font-size:13px}
.pop{position:fixed;z-index:100;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%)}
.pop.ring{border:2px solid var(--neon);box-shadow:0 0 18px var(--neon),inset 0 0 14px rgba(47,107,255,.6);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.5),rgba(47,107,255,.18) 45%,transparent 70%);animation:rg .75s ease-out forwards}
@keyframes rg{from{width:10px;height:10px;opacity:1}to{width:110px;height:110px;opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.pop{display:none}}
